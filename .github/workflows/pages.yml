name: Deploy to GitHub Pages

# Every push to main deploys the live site. To try a branch first, run this workflow by hand
# (Actions → Deploy to GitHub Pages → Run workflow, on main) and name the branch: it's built
# into nzpolls.co.nz/preview/ (not indexed, no analytics) next to the live site, until the
# next deploy. It always runs on main, so the github-pages environment allows it.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview:
        description: "Branch to build into /preview/ (leave empty for none)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # queue deploys; never cancel a live deploy part-way

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: test   # a failing test stops the deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the live site from main
        run: python3 build.py && mv dist site
      - name: Build the preview branch
        if: inputs.preview != ''
        env:
          PREVIEW: ${{ inputs.preview }}
        run: |
          git fetch --depth=1 origin "refs/heads/$PREVIEW:refs/remotes/origin/preview-src"
          git worktree add preview-src origin/preview-src
          (cd preview-src && python3 build.py --preview)
          mv preview-src/dist site/preview
          rm -f site/preview/robots.txt site/preview/sitemap.xml
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
